name: Release

# Ставим тег vX.Y.Z → собираются Linux, Windows и Android → файлы прикрепляются к релизу.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  linux:
    # TODO (этап 6): собирать в контейнере на старой базе ради Astra + AppImage/deb через fastforge.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define="BUILD_DATE=$(date -u '+%d.%m.%y %H:%M:%S')"
      - name: Упаковать tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/vysh-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: vysh-*-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define="BUILD_DATE=$((Get-Date).ToUniversalTime().ToString('dd.MM.yy HH:mm:ss'))"
      - name: Упаковать zip
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          # Рантайм MSVC рядом с exe - чтобы работало без установки VC++ Redistributable.
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "C:/Windows/System32/$dll" $dir
          }
          Compress-Archive -Path "$dir/*" `
            -DestinationPath "vysh-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: vysh-*-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Ключ подписи из секретов
        id: key
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Без секретов APK не собираем: подписанный debug-ключом нельзя обновить поверх.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Нет секрета ANDROID_KEYSTORE_BASE64, APK пропущен (см. docs/RELEASING.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vysh-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/vysh-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        if: steps.key.outputs.ok == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - if: steps.key.outputs.ok == 'true'
        run: flutter pub get
      - if: steps.key.outputs.ok == 'true'
        run: flutter build apk --release --split-per-abi --dart-define="BUILD_DATE=$(date -u '+%d.%m.%y %H:%M:%S')"
      - name: Переименовать APK
        if: steps.key.outputs.ok == 'true'
        run: |
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$f" "vysh-${GITHUB_REF_NAME}-android-${abi}.apk"
          done
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: vysh-*-android-*.apk

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужны теги - для ссылки «все изменения»
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: PKGBUILD для Arch Linux
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release/make_pkgbuild.py dist
      - name: Текст релиза из CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 tools/release/make_notes.py dist > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*
